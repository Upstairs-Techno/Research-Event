project_id = "research-awards-portal"

[auth]
site_url = "https://research-distinction.upstairstechno.com"
additional_redirect_urls = ["https://research-distinction.upstairstechno.com/reset-password", "http://localhost:5173", "http://127.0.0.1:5173"]

[auth.email]
enable_signup = true
enable_confirmations = false

# Razorpay calls this endpoint without a Supabase JWT; it is protected by its HMAC signature instead.
[functions.razorpay-webhook]
verify_jwt = false

[functions.admin-judge-management]
verify_jwt = true

[functions.account-context]
verify_jwt = true
