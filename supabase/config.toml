project_id = "research-awards-portal"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[auth.email]
enable_signup = true
enable_confirmations = false

# Razorpay calls this endpoint without a Supabase JWT; it is protected by its HMAC signature instead.
[functions.razorpay-webhook]
verify_jwt = false

[functions.admin-judge-management]
verify_jwt = true

[functions.account-context]
verify_jwt = true
